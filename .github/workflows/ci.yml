name: CI

# Runs natively on GitHub Actions. Every push to any branch gets a run, so a
# push to a PR branch always produces a signal (libviprs/libviprs#585).

on:
  push:
    branches: ['**']
  # Both jobs clone libviprs at whatever `main` is, so the thing under test
  # moves without a commit here to notice. On push-only triggers the last run
  # of any kind was 2026-08-25 while 585 core commits landed behind it, so the
  # next person to push inherits every one of those breakages at once (#57).
  # A nightly reports the drift while it is still one day wide. 05:31 UTC
  # keeps it off the top of the hour and away from libviprs-cli's nightly,
  # which runs at 06:11.
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint feature cells
    runs-on: ubuntu-latest
    steps:
      # libviprs-bench depends on `libviprs = { path = "../libviprs" }`, so
      # the core repo must sit alongside as a sibling directory.
      - uses: actions/checkout@v4
        with:
          path: libviprs-bench
      - name: Clone libviprs core (sibling path dep)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/${{ github.repository_owner }}/libviprs.git libviprs 2>/dev/null \
            || git clone --depth 1 \
              https://github.com/${{ github.repository_owner }}/libviprs.git libviprs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libviprs-bench
      # Feature cells. Target selection is `--lib --bins --tests` so the
      # feature-gated FFI code is exercised without pulling the criterion
      # bench harness into every cell.
      #
      # The default cell runs BEFORE libvips is installed, and that ordering is
      # the check. The `engines` family is the default build and it must need
      # no libvips at all — not the headers, not the binary — so the only way to
      # keep that true is to compile it on a runner where libvips is not there
      # to be found (issue #64). Moving the install below this step costs
      # nothing and is the difference between "needs no libvips" and "has
      # libvips and does not happen to call it".
      - name: check (default)
        working-directory: libviprs-bench
        run: cargo check --lib --bins --tests
      # Everything from here down is the libvips half.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: check (libvips)
        working-directory: libviprs-bench
        run: cargo check --lib --bins --tests --features libvips
      - name: check (pdfium)
        working-directory: libviprs-bench
        run: cargo check --lib --bins --features pdfium
      - name: check (polars)
        working-directory: libviprs-bench
        run: cargo check --lib --bins --features polars
      - name: clippy (libvips)
        working-directory: libviprs-bench
        run: cargo clippy --lib --tests --features libvips

  test:
    name: Test (libvips FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: libviprs-bench
      - name: Clone libviprs core (sibling path dep)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/${{ github.repository_owner }}/libviprs.git libviprs 2>/dev/null \
            || git clone --depth 1 \
              https://github.com/${{ github.repository_owner }}/libviprs.git libviprs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libviprs-bench
      # The default cell, on a runner with no libvips on it. The `check` job
      # only compiles this configuration; the tests that only exist under
      # `cfg(not(feature = "libvips"))` — the ones asserting that asking a
      # libvips-free build for the `vips` family is REFUSED rather than run
      # empty — have nowhere else to actually run (issue #64). It goes before
      # the install for the same reason the check cell does: the claim is that
      # the engines family needs no libvips, and the only way to test that is
      # on a box without it.
      #
      # Node is already on the runner image, and this suite needs it:
      # tests/engines_family_end_to_end.rs renders the charts and asserts they
      # landed, rather than skipping when the renderer is absent.
      - name: Test (default, no libvips installed)
        working-directory: libviprs-bench
        run: |
          node --version
          cargo test --lib --tests
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      # Two invocations, not one: cargo rejects `--doc` mixed with any other
      # target selector, so the old single `--lib --tests --doc` line errored
      # out before running anything. Splitting it runs both halves for real.
      - name: Test (libvips feature)
        working-directory: libviprs-bench
        run: |
          cargo test --lib --tests --features libvips
          cargo test --doc --features libvips
