[package]
name = "libviprs-bench"
version = "0.3.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
# The measured core declares `rust-version = "1.97"` as of libviprs 0.4.0, and a
# path dependency's floor is this crate's floor in practice: cargo refuses the
# build outright below it. Declaring 1.85 here said nothing true — it only meant
# the refusal came from the dependency rather than from the manifest that
# actually has to hold. The Dockerfile's Rust pin moved with it (issue #64).
rust-version = "1.97"
publish = false

[features]
default = []
libvips = ["dep:libvips-rs"]
pdfium = ["libviprs/pdfium"]
# Cross-version analysis stack. Pulls in polars for columnar
# aggregation over the BenchmarkSnapshot history. Heavy (~5 MB
# compiled), kept off by default so the everyday bench builds stay
# light. Gates the `cross_version` binary.
polars = ["dep:polars"]

# Pinned measurement profile. Benchmark numbers are only meaningful under
# a fixed optimizer configuration; this is THE config the committed
# report/ artifacts were measured with. `run-bench.sh` additionally pins
# RUSTFLAGS (recorded in each snapshot's provenance). Keep these two in
# lockstep — changing them invalidates cross-run comparisons (issue #162).
[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
libviprs = { path = "../libviprs" }
chrono = { version = "0.4", features = ["serde"] }
# NOTE: criterion is deliberately a [dev-dependency] ONLY (below), never a
# normal dependency. Nothing under src/ uses it — it is consumed solely by
# `benches/engine_comparison.rs` (dev scope). Its `html_reports` feature drags
# in `plotters` (plus plotters-svg / plotters-backend); listing criterion here
# as a normal dep would keep plotters in the NORMAL build graph, so every
# `cargo build --bin report` would still compile it — defeating the whole point
# of #42 (drop plotters from the shipped binaries). Keeping it dev-only means
# `cargo tree -i plotters -e normal` is empty; plotters survives only in the
# criterion micro-benchmark's own graph. tests/chart_shape_drift.rs asserts it.
image = "0.25"
inferno = "0.12"
libc = "0.2"
# In-process libvips FFI (gated by the `libvips` feature). Its major.minor
# MUST track the libvips the container builds — `provenance::PINNED_LIBVIPS_VERSION`
# and the Dockerfile's `ARG LIBVIPS_VERSION` (both 8.18.x). Measuring one
# libvips series through a different-series binding is its own mismatched
# oracle (issue #33); `tests/libvips_provenance.rs` asserts they stay aligned.
libvips-rs = { version = "8.18", optional = true }
polars = { version = "0.50", optional = true, default-features = false, features = [
    "lazy",
    "csv",
    "fmt",
    "diff",
    "round_series",
    "rank",
] }
serde = { version = "1", features = ["derive"] }
# Two features, both load-bearing, and independent of each other.
#
# `preserve_order` keeps a parsed object's keys in the order the producer wrote
# them. Without it `serde_json::Map` is a `BTreeMap`, so a round trip through
# `Value` alphabetises every object and the `storage` document's declared column
# order becomes unobservable by anything that reads it back
# (`tests/storage_document.rs`). Derived structs already serialise in declaration
# order; this is about the reading side.
#
# `float_roundtrip` is not a performance knob. Without it serde_json's number
# READER is not correctly rounded: it parses `0.09090909090909091`, which is the
# coefficient of variation of `[10, 11, 12]` and so a value this suite really
# produces, to the float one ULP above the one `std` and the printer agree on. A
# digest recomputed from a re-parsed document then does not match the digest its
# producer derived, and `--verify` refuses a file that nothing is wrong with.
# Worse across languages: V8's `JSON.parse` IS correctly rounded, so Rust and
# JavaScript would read one archived file as two different floats and derive two
# different digests. The feature gates serde_json's in-tree `lexical` module in
# at the float paths in `de.rs`. It adds no crates, changes no API, and has no
# interaction with `preserve_order`. `the_json_reader_is_correctly_rounded` in
# `tests/storage_provenance_k13.rs` is its canary: delete the feature and that
# test goes red (libviprs-bench #66).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# SHA-256, for three things that all want the same one: the `storage` family's
# artefact digests, the storage archive's document digests (`src/sha256.rs`), and
# the committed PDF fixture's integrity guard (`tests/pdf_fixture.rs`). It was a
# dev-dependency until the archive needed it, and promoting it costs nothing:
# `libviprs` already depends on this exact major directly (its `checksum` module
# hashes with it) and is a normal path dependency here, so this crate's binaries
# were already compiling it. Its streaming form is `pub(crate)` over there, which
# is why `src/sha256.rs` wraps `sha2` itself rather than reaching for it.
#
# Pinned to 0.11 to match libviprs. The graph is NOT single-version — `lopdf`
# (via libviprs) still pulls a sha2 0.10.x transitively — so this pin dedups
# against libviprs's direct dep rather than across the whole tree.
sha2 = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# `build.rs` digests `Cargo.lock` for `provenance.lockfileHash`, and a build
# script cannot use its own crate's library, so the same `sha2` is listed again
# here. This is the entire cost of not hand-rolling the hash: one extra
# compilation of sha2 for the host, which never reaches a shipped binary.
#
# (`tests/pdf_fixture.rs` used to pull sha2 in as a dev-dependency; it still
# compiles, because a normal dependency is in scope for tests too.)
[build-dependencies]
sha2 = "0.11"

[[bench]]
name = "engine_comparison"
harness = false

# On-demand upstream-pin validator (libviprs-bench #35/#36). Reads a GitHub
# releases JSON payload on stdin and classifies the recorded libvips pin via
# `pin_check::classify_libvips_pin` — the single classifier the tests exercise.
# `tools/check-libvips-pin.sh` curl-fetches the feed and pipes it here.
[[bin]]
name = "check-libvips-pin"
path = "src/check_libvips_pin.rs"

# The emulation probe, as a binary of its own. `tools/probe-emulation.sh` does
# NOT build it through cargo — it compiles `src/probe_emulation_main.rs` with
# bare `rustc` under two Docker platforms, because building it through cargo
# would drag the whole `libviprs` path dependency through an emulated compiler.
# This entry is here so `cargo run --bin probe-emulation` works for a human and
# so the binary is covered by the crate's own check and clippy cells.
[[bin]]
name = "probe-emulation"
path = "src/probe_emulation_main.rs"

[[bin]]
name = "flamegraph"
path = "src/flamegraph.rs"

# The door to the storage archive: --check, --archive, --verify, --provenance.
# It refuses a run it cannot vouch for rather than averaging it in, which is the
# whole reason it is a binary and not a flag on the sweep (#66).
[[bin]]
name = "storage-aggregate"
path = "src/storage_aggregate_main.rs"

[[bin]]
name = "report"
path = "src/report.rs"

# Version-matrix runner: `--versions <tag,tag,HEAD>` builds + benchmarks the
# harness against a series of core releases in one invocation, appending the
# release-history axis to benchmark_history.json (issues #19, #26, #27).
[[bin]]
name = "version_matrix"
path = "src/version_matrix_main.rs"

[[bin]]
name = "scalability"
path = "src/scalability.rs"

[[bin]]
name = "pdfium_strip_source_bench"
path = "src/pdfium_strip_source_bench.rs"
required-features = ["pdfium"]

[[bin]]
name = "cross_version"
path = "src/cross_version.rs"
required-features = ["polars"]

# The storage family: PMTiles against a directory tree (issue #65). Builds
# without the `libvips` feature, which is the point: it measures libviprs
# against itself, so it belongs in the cheap check job and in a Docker stage
# that skips the libvips source build entirely.
[[bin]]
name = "storage"
path = "src/storage_main.rs"
